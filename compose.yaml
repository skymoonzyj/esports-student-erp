name: esports-erp-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./apps/api
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://erp:erp@db:5432/erp}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:-}
      FIELD_LOOKUP_KEY: ${FIELD_LOOKUP_KEY:-}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    expose:
      - "8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  scheduler:
    build:
      context: ./apps/api
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://erp:erp@db:5432/erp}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      COHORT_SCHEDULER_INTERVAL_SECONDS: ${COHORT_SCHEDULER_INTERVAL_SECONDS:-30}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:-}
      FIELD_LOOKUP_KEY: ${FIELD_LOOKUP_KEY:-}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -m
      - app.cli.run_teaching_scheduler

  web:
    build:
      context: ./apps/web
      target: development
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    expose:
      - "5173"
    user: "node"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    command: ["npm", "run", "dev"]

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${ERP_BIND_ADDRESS:-127.0.0.1}:${ERP_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  web_node_modules:

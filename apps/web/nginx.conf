server {
    listen 5173;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /assets/ { return 404; }

    # Every asset miss is a real 404, regardless of extension. Error responses
    # deliberately do not inherit the success-only immutable header.
    location ^~ /assets/ {
        location ~* (?:/\.|\.(?:map|tsx?|jsx|log)$) {
            return 404;
        }
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ (?:^/\.|^/src/|^/etc/|\.(?:json|html|map|tsx?|log)$) {
        return 404;
    }

    location / {
        rewrite ^ /index.html last;
    }
}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-erp-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.140,<0.141",
  "uvicorn[standard]>=0.51,<0.52",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "psycopg[binary]>=3.3.4,<3.4",
  "alembic>=1.18.5,<1.19",
  "argon2-cffi>=25.1,<26",
  "cryptography>=49,<50",
  "email-validator>=2.3,<3",
  "openpyxl>=3.1.5,<4",
  "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29",
  "httpx2>=2.9.1,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<2.4",
  "types-openpyxl>=3.1.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
